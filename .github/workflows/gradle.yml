name: Java CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6.2.0
      - run: ./gradlew --no-daemon check jar sourcesJar plainJavadocJar generatePomFileForMavenPublication
      - run: bash scripts/verify-package.sh
  public-mock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.2.0
      - run: ./gradlew --no-daemon integrationTest
